<!doctype html>
<html lang="ja" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06090a" />
    <meta name="description" content="SCIENTIA EST ARMAを掲げ、一本のゼンマイから永久カレンダー、宝石オーラリー、9軸トゥールビヨンまでを同期するデジタル機械式時計。" />
    <link rel="icon" href="./favicon.svg" />
    <title>SCIENTIA Horologium Perpetuum — 永久機械式時計</title>
    <script type="module" crossorigin src="./assets/index-Cn-TqZ5m.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-uGYhA82a.css">
    <style>
      .archive-return{position:fixed;z-index:9999;left:clamp(10px,1.6vw,22px);top:clamp(10px,1.6vw,22px);width:68px;height:74px;display:grid;place-items:center;border:0;background:transparent;color:#e4c875;text-decoration:none;filter:drop-shadow(0 8px 9px #000);isolation:isolate;transition:transform .2s ease,filter .25s ease}
      .archive-return::before{content:"";position:absolute;z-index:-1;inset:7px 5px 6px;border:1px solid rgba(185,131,61,.76);border-radius:50%;background:repeating-conic-gradient(from 2deg,rgba(184,124,55,.72) 0 3deg,transparent 3deg 12deg),radial-gradient(circle,#16130e 0 56%,#070907 57% 100%);box-shadow:0 0 0 4px #050707,0 0 0 5px rgba(202,145,67,.25),inset 0 0 18px #000;animation:archive-index 24s steps(48,end) infinite}
      .archive-return img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;filter:sepia(.42) saturate(.78) brightness(.72) contrast(1.28) drop-shadow(0 0 6px rgba(209,151,70,.3))}
      .archive-return span{position:absolute;z-index:3;left:50%;bottom:-10px;min-width:58px;padding:3px 5px;border:1px solid rgba(165,113,50,.5);background:#080a08;color:#a69469;font:700 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em;text-align:center;transform:translateX(-50%)}
      .archive-return:hover{transform:translateY(-2px);filter:brightness(1.1) drop-shadow(0 8px 9px #000)}.archive-return:focus-visible{outline:2px solid #69b5a3;outline-offset:7px}
      @keyframes archive-index{to{transform:rotate(360deg)}}
      .calibre-menu-trigger{transform:translateX(78px)}
      @media(max-width:680px){.archive-return{left:7px;top:7px;width:56px;height:61px}.archive-return span{bottom:-8px;min-width:49px;font-size:7px}.calibre-menu-trigger{transform:translateX(58px)}}
      @media(prefers-reduced-motion:reduce){.archive-return::before{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <a id="archive-return" class="archive-return" href="../#works" aria-label="総合実績金庫へ戻る">
      <img src="./scientia-emblem.png" alt="">
      <span>EA–001</span>
    </a>
    <script>
      (() => {
        const mode = new URLSearchParams(location.search).get('from');
        if (['all', 'poker', 'video', 'tech'].includes(mode)) {
          document.getElementById('archive-return').href = `../?mode=${mode}#works`;
        }
      })();
    </script>
  </body>
</html>
